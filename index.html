<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBU Scanner - Biometría Cutánea</title>
    <style>
        :root {
            --bg-color: #05050a;
            --panel-bg: #0f101a;
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.4);
            --danger: #ff3366;
            --text: #e0e0e0;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: var(--panel-bg);
            border: 2px solid var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: var(--accent);
            margin-top: 0;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1;
            background: #1a1b2f;
            border: 1px solid var(--accent);
            color: var(--text);
            padding: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.85rem;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 10px var(--accent);
        }
        .viewport {
            position: relative;
            width: 100%;
            height: 280px;
            background: #000;
            border: 1px dashed var(--accent);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin-bottom: 15px;
        }
        #webcamVideo, #previewImage {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button.action-btn {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 12px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }
        button.action-btn:active {
            background: var(--accent);
            color: #000;
        }
        .status-box {
            background: #05050a;
            border: 1px solid #333;
            padding: 10px;
            font-size: 0.8rem;
            margin-top: 10px;
            min-height: 40px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>MBU TERMINAL V1.0</h2>
    
    <div class="tabs">
        <button class="tab-btn active" id="btnEnroll" onclick="switchMode('enroll')">1. REGISTRAR MBU</button>
        <button class="tab-btn" id="btnVerify" onclick="switchMode('verify')">2. VERIFICAR ACCESO</button>
    </div>

    <div class="viewport" id="viewport">
        <!-- Video para la cámara en vivo con atributos móviles críticos -->
        <video id="webcamVideo" autoplay playsinline muted class="hidden"></video>
        <!-- Imagen estática cargada -->
        <img id="previewImage" class="hidden" alt="Muestra MBU">
        <!-- Canvas para dibujar la constelación biométrica -->
        <canvas id="overlayCanvas"></canvas>
        <div id="placeholderText" style="color: #666; font-size: 0.8rem; text-align: center; padding: 20px;">
            [ SIN SEÑAL DE ENTRADA ]<br>Usa los controles de abajo
        </div>
    </div>

    <div class="controls">
        <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
        
        <button class="action-btn" onclick="document.getElementById('fileInput').click()">📁 Subir Foto de Piel</button>
        <button class="action-btn" id="camBtn" onclick="toggleCamera()">📷 Activar Cámara Móvil</button>
        <button class="action-btn" id="scanBtn" style="border-color: var(--accent); color: var(--accent);" onclick="runScan()">⚡ Analizar Constelación MBU</button>
    </div>

    <div class="status-box" id="statusLog">
        Sistema en espera. Selecciona una fuente de imagen o activa la cámara.
    </div>
</div>

<script>
    let currentMode = 'enroll';
    let isCameraActive = false;
    let videoStream = null;
    let registeredHash = null; // Almacena el "Hash MBU" guardado

    const video = document.getElementById('webcamVideo');
    const imgPreview = document.getElementById('previewImage');
    const canvas = document.getElementById('overlayCanvas');
    const ctx = canvas.getContext('2d');
    const placeholder = document.getElementById('placeholderText');
    const statusLog = document.getElementById('statusLog');

    function switchMode(mode) {
        currentMode = mode;
        stopCamera();
        clearViewport();
        
        if(mode === 'enroll') {
            document.getElementById('btnEnroll').classList.add('active');
            document.getElementById('btnVerify').classList.remove('active');
            document.getElementById('scanBtn').innerText = "⚡ Registrar MBU";
            statusLog.innerText = "Modo Registro activo. Captura la marca biológica base.";
        } else {
            document.getElementById('btnVerify').classList.add('active');
            document.getElementById('btnEnroll').classList.remove('active');
            document.getElementById('scanBtn').innerText = "🔍 Verificar Acceso MBU";
            statusLog.innerText = "Modo Verificación activo. Escanea para comparar con el registro.";
        }
    }

    function clearViewport() {
        video.classList.add('hidden');
        imgPreview.classList.add('hidden');
        placeholder.classList.remove('hidden');
        imgPreview.src = "";
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function handleImageUpload(event) {
        stopCamera();
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                imgPreview.src = e.target.result;
                imgPreview.classList.remove('hidden');
                placeholder.classList.add('hidden');
                video.classList.add('hidden');
                statusLog.innerText = "Imagen cargada correctamente. Listo para análisis.";
            }
            reader.readAsDataURL(file);
        }
    }

    async function toggleCamera() {
        if (isCameraActive) {
            stopCamera();
            statusLog.innerText = "Cámara detenida.";
        } else {
            try {
                clearViewport();
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' } 
                });
                video.srcObject = videoStream;
                video.classList.remove('hidden');
                placeholder.classList.add('hidden');
                
                // Forzar reproducción explícita para dispositivos móviles
                await video.play();
                
                isCameraActive = true;
                document.getElementById('camBtn').innerText = "🛑 Detener Cámara";
                statusLog.innerText = "Cámara en vivo activa y sincronizada.";
            } catch (err) {
                statusLog.innerText = "Error al abrir la cámara: " + err.message;
            }
        }
    }

    function stopCamera() {
        if (videoStream) {
            videoStream.getTracks().forEach(track => track.stop());
            videoStream = null;
        }
        video.pause();
        video.srcObject = null;
        isCameraActive = false;
        document.getElementById('camBtn').innerText = "📷 Activar Cámara Móvil";
    }

    function runScan() {
        if (video.classList.contains('hidden') && imgPreview.classList.contains('hidden')) {
            statusLog.innerText = "⚠️ Error: No hay ninguna imagen ni video activo para escanear.";
            return;
        }

        statusLog.innerText = "Analizando geometría cutánea y patrones de pigmento...";
        
        // Ajustar resolución del canvas interno
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Generar puntos simulados de lunares basados en coordenadas aleatorias estables
        setTimeout(() => {
            const pointsCount = Math.floor(Math.random() * 3) + 4; // Entre 4 y 6 puntos
            let points = [];
            
            for(let i=0; i<pointsCount; i++) {
                points.push({
                    x: Math.random() * (canvas.width - 60) + 30,
                    y: Math.random() * (canvas.height - 60) + 30
                });
            }

            // Dibujar miras y constelación
            ctx.strokeStyle = '#00ffcc';
            ctx.fillStyle = '#00ffcc';
            ctx.lineWidth = 1.5;

            // Dibujar líneas conectoras
            ctx.beginPath();
            for(let i=0; i<points.length; i++) {
                if(i === 0) ctx.moveTo(points[i].x, points[i].y);
                else ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.closePath();
            ctx.stroke();

            // Dibujar miras en los puntos detectados
            points.forEach((p, index) => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
                ctx.fillText(`M${index+1}`, p.x + 12, p.y + 4);
            });

            // Generar Hash MBU sintético
            let mockHash = 'MBU-' + Math.random().toString(36).substring(2, 10).toUpperCase();

            if (currentMode === 'enroll') {
                registeredHash = mockHash;
                statusLog.innerHTML = `✅ <b>MBU Registrada con éxito.</b><br>Hash único generado: <code style="color:var(--accent);">${registeredHash}</code>`;
            } else {
                if (!registeredHash) {
                    statusLog.innerText = "⚠️ Primero debes registrar una MBU en la pestaña anterior.";
                    return;
                }
                // Simular coincidencia
                let matchPercent = Math.floor(Math.random() * 15) + 85; // 85% a 99%
                if (matchPercent > 88) {
                    statusLog.innerHTML = `🔓 <b style="color:var(--accent);">ACCESO CONCEDIDO</b><br>Coincidencia MBU: ${matchPercent}% (${mockHash})`;
                } else {
                    statusLog.innerHTML = `🔒 <b style="color:var(--danger);">ACCESO DENEGADO</b><br>Patrón divergente (${matchPercent}% de similitud).`;
                }
            }
        }, 800);
    }
</script>

</body>
  </html>
